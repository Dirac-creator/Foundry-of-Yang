name: checks
on:
  push:
    branches-ignore: [foundry-data]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev,server]"
      - run: python -m foundry validate examples/demo_dataset.json
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/github-store.test.cjs
      - run: python scripts/build_pages.py
