[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-of-yang"
version = "0.1.0"
description = "Integrated photonics process data and simulation foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format-nongpl]==4.23.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foundry = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
