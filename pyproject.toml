[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-of-yang"
version = "0.4.0"
description = "Integrated photonics process data and simulation foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format-nongpl]==4.23.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1"]
server = ["fastapi==0.141.1", "uvicorn==0.53.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foundry = ["schemas/*.json"]
"foundry.service" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
